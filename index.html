<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f2f7fd">
  <meta name="description" content="AEGIS: monitoramento de acesso escolar. Acesse sua instituição para continuar.">
  <title>Entrar · AEGIS</title>
  <link rel="icon" type="image/svg+xml" href="./assets/aegis-mark.svg">
  <link rel="stylesheet" href="./style.css?v=11">
  <script src="./AegisShared.js?v=10" defer></script>
  <script src="./index.js?v=10" defer></script>
</head>
<body class="login-page">
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div id="app">
    <main class="auth-page" id="main" tabindex="-1" aria-labelledby="login-title">
      <section class="auth-content" aria-labelledby="login-title">
        <header class="auth-brand">
          <span class="brand"><img class="brand-logo" src="./assets/aegis-logo.png" width="516" height="158" alt="AEGIS"></span>
          <p class="auth-tagline">Monitoramento de acesso escolar</p>
        </header>
        <header class="auth-heading">
          <h1 id="login-title">Bem-vindo</h1>
          <p>Acesse sua instituição para continuar.</p>
        </header>
        <form method="post" class="auth-form" id="login-form" aria-labelledby="login-title">
          <div class="auth-field">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V7l8-4v18M12 10h8v11M2 21h20M7 9h2m-2 4h2m-2 4h2m6-4h2m-2 4h2"/></svg>
            <div class="field">
              <label for="institution">Instituição</label>
              <input class="input" id="institution" name="institution" autocomplete="organization" placeholder="Nome da instituição" required maxlength="80">
            </div>
          </div>
          <div class="auth-field">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14v3"/></svg>
            <div class="field">
              <label for="password">Senha</label>
              <input class="input" type="password" id="password" name="password" autocomplete="current-password" placeholder="Digite sua senha" required maxlength="80">
            </div>
            <button class="icon-button" type="button" data-action="toggle-password" aria-label="Mostrar senha" aria-pressed="false" aria-controls="password"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
          </div>
          <p class="form-error" id="login-error" role="alert"></p>
          <button class="btn primary full auth-submit" type="submit">Entrar</button>
        </form>
        <nav class="auth-support" aria-label="Opções de acesso">
          <a href="SolicitarAcesso.html">Solicitar acesso</a>
          <button type="button" class="auth-credentials" data-action="open-credentials" aria-haspopup="dialog" aria-controls="modal">Acesso de demonstração</button>
        </nav>
        <noscript><p class="form-error">Ative o JavaScript para acessar a plataforma.</p></noscript>
      </section>
      <footer class="auth-links"><a href="Privacidade.html">Política de Privacidade</a></footer>
    </main>
  </div>
  <dialog id="modal" aria-labelledby="modal-title">
    <header class="modal-head"><h2 id="modal-title">Acesso de demonstração</h2><button class="icon-button" type="button" data-action="close-modal" aria-label="Fechar janela" autofocus><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></header>
    <div class="modal-body">
      <dl class="auth-access-data"><div><dt>Instituição</dt><dd>CIMOL</dd></div><div><dt>Senha</dt><dd>AEGIS2026</dd></div><div><dt>Código PRB</dt><dd>123456</dd></div></dl>
      <button class="btn primary full" type="button" data-action="demo-login">Acessar plataforma</button>
    </div>
  </dialog>
</body>
</html>
